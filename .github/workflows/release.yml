name: Release

# Builds the Android APK (and, when configured, the Nesso N1 firmware) and
# attaches them to a GitHub Release.
#
# Triggers:
#   - push a tag like v0.1.0
#   - or run manually from the Actions tab (provide a tag name)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android-balac-control
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Stage APK
        run: |
          mkdir -p artifacts
          cp android-balac-control/app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/balac-control-${TAG}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: artifacts/*.apk

  firmware:
    name: Build Nesso N1 firmware
    runs-on: ubuntu-latest
    env:
      # TODO(maintainer): fill these in with the official Arduino Nesso N1 core
      # coordinates. Once set, each release automatically gets firmware binaries.
      # Leave empty to skip the firmware build (the release still gets the APK).
      NESSO_CORE_URL: "" # e.g. https://.../package_nesso_index.json ("" if in the default index)
      NESSO_CORE: "" # e.g. arduino:esp32c6  (core package to install)
      NESSO_FQBN: "" # e.g. arduino:esp32c6:nesso_n1  (fully-qualified board name)
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$NESSO_CORE" ] || [ -z "$NESSO_FQBN" ]; then
            echo "::warning::Nesso N1 core coordinates not set in .github/workflows/release.yml (NESSO_CORE / NESSO_FQBN); skipping firmware build."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install arduino-cli
        if: steps.cfg.outputs.configured == 'true'
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Install core and libraries
        if: steps.cfg.outputs.configured == 'true'
        run: |
          arduino-cli config init
          if [ -n "$NESSO_CORE_URL" ]; then
            arduino-cli config add board_manager.additional_urls "$NESSO_CORE_URL"
          fi
          arduino-cli core update-index
          arduino-cli core install "$NESSO_CORE"
          arduino-cli lib install "Arduino_BMI270_BMM150"

      - name: Compile firmware
        if: steps.cfg.outputs.configured == 'true'
        run: |
          mkdir -p artifacts/firmware
          arduino-cli compile \
            --fqbn "$NESSO_FQBN" \
            --output-dir "artifacts/firmware" \
            --log-level warn \
            BalaCplus

      - name: Rename firmware binary
        if: steps.cfg.outputs.configured == 'true'
        run: |
          bin=$(ls artifacts/firmware/*.bin 2>/dev/null | head -1 || true)
          if [ -n "$bin" ]; then
            cp "$bin" "artifacts/firmware/balac-firmware-${TAG}.bin"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.configured == 'true'
        with:
          name: firmware
          path: artifacts/firmware/**
          if-no-files-found: warn

  release:
    name: Publish release
    needs: [android, firmware]
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        run: find dist -type f -print || true

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/**/*.apk
            dist/**/*.bin
            dist/**/*.elf
            dist/**/*.hex
            dist/**/*.uf2
